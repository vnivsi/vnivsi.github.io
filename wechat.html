<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WeChat · Liam</title>


<style>

* {
    box-sizing:border-box;
}


html {
    overflow-y:scroll;
}



body {

    margin:0;

    background:#faf9f7;

    color:#222;

    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    "PingFang SC",
    "Noto Sans SC",
    "Microsoft YaHei",
    Arial,
    sans-serif;

    min-height:100vh;

    display:flex;

    justify-content:center;

}





.container {

    width:100%;

    max-width:900px;

    text-align:center;

    padding:45px 30px 60px;

}





/* Avatar */


.avatar {

    width:80px;

    height:80px;

    border-radius:50%;

    object-fit:cover;

    display:block;

    margin:0 auto 18px;

    border:1px solid #eeeeee;

}





/* Liam */


.name {

    font-size:24px;

    font-weight:600;

    letter-spacing:0.8px;

    color:rgb(255,106,0);

    margin-bottom:18px;

}





/* Navigation */


.nav {

    display:flex;

    justify-content:center;

    align-items:center;

    gap:22px;

    flex-wrap:nowrap;

    white-space:nowrap;

    margin-bottom:30px;

}



.nav a {

    color:#222;

    text-decoration:none;

    font-size:14px;

    font-weight:600;

    position:relative;

    padding-bottom:6px;

}



.nav a:hover {

    color:rgb(255,106,0);

}





/* QR Content */


.qr-content {

    max-width:500px;

    margin:0 auto;

    color:#777;

    font-size:14px;

    line-height:1.8;

}





.qr-title {

    font-size:14px;

    font-weight:600;

    color:#555;

    margin-bottom:22px;

}





.qr-image {

    width:180px;

    height:180px;

    object-fit:contain;

    margin:0 auto 22px;

}





.qr-note {

    font-size:12px;

    line-height:1.8;

    color:#777;

}





/* Back */


.back {

    margin-top:35px;

}



.back a {

    color:#555;

    font-size:13px;

    font-weight:600;

    text-decoration:underline;

}



.back a:hover {

    color:rgb(255,106,0);

}





/* Footer */


.footer {

    margin-top:55px;

    color:#999;

    font-size:11px;

    line-height:1.5;

}





/* Mobile */


@media(max-width:600px){


.container {

    padding:35px 20px 50px;

}



.avatar {

    width:70px;

    height:70px;

}



.name {

    font-size:22px;

}



.nav {

    flex-wrap:wrap;

    white-space:normal;

    gap:15px;

}



.nav a {

    font-size:13px;

}



.qr-image {

    width:170px;

    height:170px;

}



.footer {

    padding:0 10px;

}


}


</style>


</head>



<body>


<div class="container">



<img class="avatar" src="avatar.png" alt="Liam Avatar">



<div class="name">

Liam

</div>





<div class="nav">


<a href="index.html">

Home / 首页

</a>



<a href="connections.html">

Connections / 连接

</a>



<a href="about.html">

About Me / 关于我

</a>



</div>








<div class="qr-content">





<div class="qr-title">

WeChat / 微信

</div>






<img class="qr-image" src="assets/qrcode/wechat.png" alt="WeChat QR Code">






<div class="qr-note">


Scan with WeChat or save and recognize in WeChat.


<br>


微信扫描，或保存后在微信内识别。


</div>







<div class="back">


<a href="connections.html">

← Back to Connections

</a>


</div>







</div>







<div class="footer">


Copyright © 2026 - 2028 Liam.

<br>

All Rights Reserved.


</div>





</div>


</body>


</html>
